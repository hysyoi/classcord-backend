version: '3.8'

services:
  # 1. PostgreSQL 資料庫服務 (啟用 pgvector 支援)
  postgres:
    image: pgvector/pgvector:pg16
    container_name: classcord_postgres_prod
    restart: always
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: classcord
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
      - ./src/test/resources/scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d classcord"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Redis 緩存服務
  redis:
    image: redis:7.2-alpine
    container_name: classcord_redis_prod
    restart: always
    volumes:
      - redisdata_prod:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # 3. RabbitMQ 訊息佇列服務
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: classcord_rabbitmq_prod
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    ports:
      # 管理頁面只對本機 127.0.0.1 開放，外部若要登入可透過 SSH tunnel 或 Nginx 代理，安全性高
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmqdata_prod:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 4. Spring Boot 後端 API 服務 (從 GitHub GHCR 自動拉取已打包好的 Image)
  backend:
    image: ghcr.io/hysyoi/classcord-backend:${IMAGE_TAG:-latest}
    container_name: classcord_backend_prod
    restart: always
    ports:
      # 僅對 Droplet 的 127.0.0.1:8080 開放，確保所有公網請求都必須經過外部的 Nginx 反向代理
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      # 連線位址全部改為 Docker 內部虛擬網路的服務容器名稱
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/classcord?reWriteBatchedInserts=true
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_RABBITMQ_USERNAME=${RABBITMQ_USERNAME:-guest}
      - SPRING_RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD:-guest}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - S3_ENDPOINT=${S3_ENDPOINT}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY}
      - S3_SECRET_KEY=${S3_SECRET_KEY}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME}
      - S3_PUBLIC_URL=${S3_PUBLIC_URL}
      - TURNSTILE_ENABLED=${TURNSTILE_ENABLED:-true}
      - TURNSTILE_SITE_KEY=${TURNSTILE_SITE_KEY}
      - TURNSTILE_SECRET_KEY=${TURNSTILE_SECRET_KEY}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
      - DISCORD_CLIENT_ID=${DISCORD_CLIENT_ID}
      - DISCORD_CLIENT_SECRET=${DISCORD_CLIENT_SECRET}
      - SPRING_MAIL_PASSWORD=${SPRING_MAIL_PASSWORD}

volumes:
  pgdata_prod:
  redisdata_prod:
  rabbitmqdata_prod:
