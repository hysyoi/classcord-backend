spring:
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate

  lifecycle:
    timeout-per-shutdown-phase: 30s

  # 正式對接雲端 Resend 服務
  mail:
    host: smtp.resend.com
    port: 587
    username: resend
    password: ${SPRING_MAIL_PASSWORD} # 密碼由系統環境變數注入
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  shutdown: graceful

logging:
  level:
    root: WARN
    com.hys.classcord: INFO
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: WARN

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  metrics:
    tags:
      application: classcord-backend
