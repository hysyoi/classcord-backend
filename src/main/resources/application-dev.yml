# 這裡存放上雲端後「特有」的設定（例如：串接真實 Resend 發信服務）
spring:
  # 雲端自動建表配置 (初次啟動時自動建立，穩定後建議手動改成 validate)
  jpa:
    hibernate:
      ddl-auto: update
  # 正式對接雲端 Resend 服務
  mail:
    host: smtp.resend.com
    port: 587
    username: resend
    password: ${SPRING_MAIL_PASSWORD} # 密碼由系統環境變數注入
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true