spring:
  application:
    name: classcord-backend

  profiles:
    active: local

  datasource:
    url: jdbc:postgresql://localhost:5432/classcord
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: localhost
      port: 6379

app:
  jwt: # 可能也可以抽成一個properties類
    secret-key: ${JWT_SECRET_KEY}
    expiration-ms: 86400000 # 24小時以毫秒計算
  urls:
    backend: http://localhost:8080
    frontend: http://localhost:3000