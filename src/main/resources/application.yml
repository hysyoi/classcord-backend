spring:
  application:
    name: classcord-backend

  profiles:
    active: local

  datasource:
    url: jdbc:postgresql://localhost:5432/classcord
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: localhost
      port: 6379

app:
  jwt:
    secret-key: ${JWT_SECRET_KEY}