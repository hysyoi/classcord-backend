apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: classcord
spec:
  replicas: 1
  strategy:
    type: Recreate   # 用了本地 PVC，同時開兩份會搶同一份磁碟資料
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      nodeSelector:
        workload: main   # 釘在 Droplet 1：用了本地 PVC，飄到別的節點會連不到舊資料
      containers:
        - name: prometheus
          image: prom/prometheus:v2.51.0
          args:
            - '--config.file=/etc/prometheus/prometheus.yml'
            - '--storage.tsdb.path=/prometheus'
            - '--web.enable-lifecycle'
          ports:
            - containerPort: 9090
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "300m"
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: data
              mountPath: /prometheus
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 9090
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: 9090
            initialDelaySeconds: 30
            periodSeconds: 15
      volumes:
        - name: config
          # ConfigMap 更新後 Pod 裡的檔案會自動同步，但 Prometheus 程序不會自己重讀，
          # 開了 --web.enable-lifecycle，改完 scrape target 用這個讓它生效即可，不用重啟 Pod：
          # kubectl exec -n classcord deploy/prometheus -- wget --post-data='' -qO- http://localhost:9090/-/reload
          configMap:
            name: prometheus-config
        - name: data
          persistentVolumeClaim:
            claimName: prometheus-data
