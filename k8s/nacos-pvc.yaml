apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nacos-data
  namespace: classcord
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nacos-logs
  namespace: classcord
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
