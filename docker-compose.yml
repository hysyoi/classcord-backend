services:
  # 1. PostgreSQL 資料庫服務
  postgres:
    image: pgvector/pgvector:pg16
    container_name: classcord_postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: classcord
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./src/test/resources/scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    # 整合健康檢查：使用用戶變數與資料庫名稱
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d classcord"]
      interval: 2s
      timeout: 5s
      retries: 10

  # 2. pgAdmin 4 圖形化管理工具
  pgadmin:
    image: dpage/pgadmin4
    container_name: classcord_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@email.com
      PGADMIN_DEFAULT_PASSWORD: adminpassword
    ports:
      - "8181:80"
    depends_on:
      postgres:
        condition: service_healthy # 讓 pgadmin 等到 postgres 真正健康後才啟動

  # 3. Redis 服務
  redis:
    image: redis:7.2-alpine
    container_name: classcord_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    # 整合 Redis 健康檢查
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      timeout: 3s
      retries: 5

  # 4. Redis 測試服務
  redis-test:
    image: redis:7.2-alpine
    container_name: classcord_redis_test
    restart: always
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      timeout: 3s
      retries: 5

  # 5. RabbitMQ 訊息佇列服務
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: classcord_rabbitmq
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"   # AMQP 訊息傳送連線埠
      - "15672:15672" # Web 控制台管理介面連線埠
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq
    command: >
      sh -c "rabbitmq-server &
             until rabbitmqctl await_startup; do sleep 1; done;
             rabbitmqctl add_vhost /test;
             rabbitmqctl set_permissions -p /test guest '.*' '.*' '.*';
             wait"
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping && rabbitmqctl list_vhosts | grep -q '/test'"]
      interval: 3s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  redisdata:
  rabbitmqdata: