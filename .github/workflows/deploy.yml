name: Java Spring Cloud CD (Auto Deploy to 2 Droplets)

on:
  push:
    tags:
      - 'v*' # 只有推送符合 v* 的 tag 時才觸發自動部署
  workflow_dispatch: # 允許手動觸發部署

jobs:
  # ==========================================================
  # 任務 1：構建並推播 3 個微服務 Docker Images 至 GHCR
  # ==========================================================
  build-and-push-images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 1.1 構建 classcord-gateway
      - name: Build & Push Gateway Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./classcord-gateway/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/classcord-gateway:latest
            ghcr.io/${{ github.repository_owner }}/classcord-gateway:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 1.2 構建 classcord-main-service
      - name: Build & Push Main Service Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./classcord-main-service/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/classcord-main-service:latest
            ghcr.io/${{ github.repository_owner }}/classcord-main-service:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 1.3 構建 classcord-ai-service
      - name: Build & Push AI Service Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./classcord-ai-service/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/classcord-ai-service:latest
            ghcr.io/${{ github.repository_owner }}/classcord-ai-service:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==========================================================
  # 任務 2：部署 Droplet #1 (主業務與基礎設施機)
  # ==========================================================
  deploy-to-droplet1:
    needs: build-and-push-images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Copy Configuration Files via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST_DROPLET1 || secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          source: "docker-compose.main.prod.yml,prometheus/prometheus.yml,scripts/init-db.prod.sql"
          target: "/opt/classcord-main"

      - name: SSH to Droplet #1 and Deploy Main Stack
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST_DROPLET1 || secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          script: |
            cd /opt/classcord-main
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            export IMAGE_TAG=${{ github.ref_name }}
            docker compose -f docker-compose.main.prod.yml pull
            docker compose -f docker-compose.main.prod.yml up -d
            docker image prune -f
            docker logout ghcr.io

  # ==========================================================
  # 任務 3：部署 Droplet #2 (AI 獨立運算機)
  # ==========================================================
  deploy-to-droplet2:
    needs: build-and-push-images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Copy AI Configuration File via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST_DROPLET2 || secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          source: "docker-compose.ai.prod.yml"
          target: "/opt/classcord-ai"

      - name: SSH to Droplet #2 and Deploy AI Stack
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST_DROPLET2 || secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          script: |
            cd /opt/classcord-ai
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            export IMAGE_TAG=${{ github.ref_name }}
            export DROPLET1_PRIVATE_IP=${{ secrets.DROPLET1_PRIVATE_IP }}
            docker compose -f docker-compose.ai.prod.yml pull
            docker compose -f docker-compose.ai.prod.yml up -d
            docker image prune -f
            docker logout ghcr.io

  # ==========================================================
  # 任務 4：雙機部署狀態 Discord 通知
  # ==========================================================
  notify:
    needs: [deploy-to-droplet1, deploy-to-droplet2]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Send Discord Notification
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_CD_WEBHOOK_URL }}
          status: ${{ job.status }}
          content: "<@${{ secrets.DISCORD_USER_ID }}> 雙機 CD 自動化部署執行完畢！"
          title: "🚀 ClassCord 微服務 雙機 CD 部署狀態"
          description: |
            **版本 Tag**: `${{ github.ref_name }}`
            **觸發者**: `${{ github.actor }}`
            **Droplet #1 (Main Stack)**: 已發布 Gateway & Main Service
            **Droplet #2 (AI Stack)**: 已發布 AI Service
          nofail: true
