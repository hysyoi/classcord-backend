name: Java Spring Cloud CD (Auto Deploy to 2 Droplets)

on:
  push:
    tags:
      - 'v*' # 只有推送符合 v* 的 tag 時才觸發自動部署
  workflow_dispatch: # 允許手動觸發部署

jobs:
  # ==========================================================
  # 任務 1：構建並推播 3 個微服務 Docker Images 至 GHCR
  # ==========================================================
  build-and-push-images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 1.1 構建 classcord-gateway
      - name: Build & Push Gateway Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./classcord-gateway/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/classcord-gateway:latest
            ghcr.io/${{ github.repository_owner }}/classcord-gateway:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 1.2 構建 classcord-main-service
      - name: Build & Push Main Service Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./classcord-main-service/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/classcord-main-service:latest
            ghcr.io/${{ github.repository_owner }}/classcord-main-service:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 1.3 構建 classcord-ai-service
      - name: Build & Push AI Service Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./classcord-ai-service/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/classcord-ai-service:latest
            ghcr.io/${{ github.repository_owner }}/classcord-ai-service:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==========================================================
  # 任務 2：部署 Droplet #1 (主業務與基礎設施機)
  # ==========================================================
  deploy-to-droplet1:
    needs: build-and-push-images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Copy Configuration Files via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST_DROPLET1 || secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          source: "docker-compose.main.prod.yml,prometheus/prometheus.yml,scripts/init-db.prod.sql,k8s"
          target: "/opt/classcord-main"

      - name: SSH to Droplet #1 — Update Infra Stack + Deploy 3 Services to k3s
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST_DROPLET1 || secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          script: |
            cd /opt/classcord-main
            export IMAGE_TAG=${{ github.ref_name }}

            # 基礎設施 (nacos/postgres/redis/rabbitmq/seata 等) 幾乎不會跟著這次改動，
            # 但留著這步是幂等的，不會影響已經在跑的容器，作為保險
            docker compose -f docker-compose.main.prod.yml pull
            docker compose -f docker-compose.main.prod.yml up -d
            docker image prune -f

            # gateway、main-service、ai-service 三個服務已改由 k3s 管理，
            # 先套用 git 裡最新的 manifest（資源上限、更新策略、nodeSelector 等結構性設定），
            # 不會動到 Secret（那些從來不是檔案，維持手動管理）
            sudo k3s kubectl apply -f k8s/

            # 再用 kubectl set image 把 image 換成這次實際發布的版本號
            sudo k3s kubectl set image deployment/gateway gateway=ghcr.io/hysyoi/classcord-gateway:${IMAGE_TAG} -n classcord
            sudo k3s kubectl set image deployment/main-service main-service=ghcr.io/hysyoi/classcord-main-service:${IMAGE_TAG} -n classcord
            sudo k3s kubectl set image deployment/ai-service ai-service=ghcr.io/hysyoi/classcord-ai-service:${IMAGE_TAG} -n classcord

            sudo k3s kubectl rollout status deployment/gateway -n classcord --timeout=180s
            sudo k3s kubectl rollout status deployment/main-service -n classcord --timeout=180s
            sudo k3s kubectl rollout status deployment/ai-service -n classcord --timeout=180s

  # ==========================================================
  # 任務 3：部署狀態 Discord 通知
  # ==========================================================
  notify:
    needs: [deploy-to-droplet1]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Send Discord Notification
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_CD_WEBHOOK_URL }}
          status: ${{ job.status }}
          content: "<@${{ secrets.DISCORD_USER_ID }}> CD 自動化部署執行完畢！"
          title: "🚀 ClassCord 微服務 CD 部署狀態"
          description: |
            **版本 Tag**: `${{ github.ref_name }}`
            **觸發者**: `${{ github.actor }}`
            **k3s (Droplet 1 主節點 + Droplet 2 工作節點)**: 已發布 Gateway、Main Service、AI Service
            **Droplet 1 基礎設施**: nacos/postgres/redis/rabbitmq/seata 等維持 docker-compose 管理
          nofail: true
