name: Java Spring Boot CD (Auto Deploy to Droplet)

on:
  push:
    tags:
      - 'v*' # 只有推送符合 v* 的 tag 時才觸發自動部署
  workflow_dispatch: # 允許手動觸發部署

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # 需要寫入 GHCR 的權限

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      # 使用 Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 登入 GitHub Container Registry (GHCR)
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 編譯並推播 Docker Image
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          # 將 Image 名稱轉為全小寫以防 GitHub Registry 報錯
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-to-droplet:
    needs: build-and-push-image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code (to copy docker-compose.prod.yml)
        uses: actions/checkout@v6

      # 將專案最新的 docker-compose.prod.yml 與 Prometheus 設定檔複製到 Droplet 上
      - name: Copy Configuration Files via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          source: "docker-compose.prod.yml,prometheus/prometheus.yml"
          target: "/opt/classcord-backend"

      # 執行遠端部署指令
      - name: SSH to Droplet and Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          script: |
            cd /opt/classcord-backend
            
            # 1. 登入 GHCR (以利拉取私有 Image)
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            # 2. 設定環境變數 Image Tag 供 docker-compose 讀取
            export IMAGE_TAG=${{ github.ref_name }}
            
            # 3. 拉取最新映像檔
            docker compose -f docker-compose.prod.yml pull backend
            
            # 4. 啟動/更新所有容器 (只重啟有變更的 backend 與新加入的 prometheus/grafana)
            docker compose -f docker-compose.prod.yml up -d
            
            # 5. 清理過期或未使用的 Docker Image 釋放主機空間
            docker image prune -f
            
            # 6. 登出 GHCR 安全撤銷憑證
            docker logout ghcr.io

      # 發送 Discord 通知 (部署成功與失敗皆會發送)
      - name: Send Discord Notification
        if: always()
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_CD_WEBHOOK_URL }}
          status: ${{ job.status }}
          content: "<@${{ secrets.DISCORD_USER_ID }}> CD 部署執行完畢！"
          title: "🚀 ClassCord Backend CD 部署狀態"
          description: |
            **Commit 訊息**: ${{ github.event.head_commit.message }}
            **版本 Tag**: `${{ github.ref_name }}`
            **觸發者**: `${{ github.actor }}`
          nofail: true
