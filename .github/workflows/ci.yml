name: Java Spring Boot CI

on:
  pull_request:
    branches: [ main ] # 限制只有發送 PR 到 main 分支時才觸發
    types: [opened, reopened, synchronize]
  workflow_dispatch: # 允許在 GitHub 網頁介面手動點擊 Run workflow

jobs:
  # ==========================================
  # 任務：編譯、排版檢查與資料庫測試 (CI)
  # ==========================================
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      # 步驟 1：下載程式碼
      - name: Checkout repository
        uses: actions/checkout@v6

      # 步驟 2：設定 Java 21 與 Maven 快取
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      # 步驟 3：複製測試設定檔範本（解決 gitignore 的問題）
      - name: Copy Test Configuration
        run: cp src/test/resources/application-test.yml.example src/test/resources/application-test.yml

      # 步驟 4：啟動資料庫與 Redis 容器
      - name: Start Databases via Docker Compose
        env:
          DB_USERNAME: admin
          DB_PASSWORD: password
        run: docker compose up -d --wait postgres redis-test rabbitmq

      # 步驟 5：檢查程式碼格式是否符合規範 (Spotless)
      - name: Check code formatting
        run: ./mvnw spotless:check

      # 步驟 6：編譯專案並執行測試
      - name: Build and Run Tests
        run: ./mvnw clean verify

      # 步驟 7：發送 Discord 通知 (成功與失敗皆會 Tag)
      - name: Send Discord Notification
        if: always()
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_CI_WEBHOOK_URL }}
          status: ${{ job.status }}
          content: "<@${{ secrets.DISCORD_USER_ID }}> CI 執行完畢！"
          title: "🔨 Java Spring Boot CI"
          description: |
            **PR 標題**: ${{ github.event.pull_request.title || '手動觸發 / 非 PR 觸發' }}
            **觸發者**: `${{ github.actor }}`
            **分支**: `${{ github.ref_name }}`
          nofail: true